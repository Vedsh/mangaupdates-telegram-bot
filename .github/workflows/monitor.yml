name: MangaUpdates Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check MangaUpdates RSS
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
         
      - name: Test Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c "import os,requests; requests.post(f'https://api.telegram.org/bot{os.environ[\"BOT_TOKEN\"]}/sendMessage',data={'chat_id':os.environ['CHAT_ID'],'text':'✅ MangaUpdates Telegram Bot is working!'})"

      - name: Check MangaUpdates RSS
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Save seen releases
        run: |
          git config user.name "MangaUpdates Bot"
          git config user.email "actions@github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update release tracking"
            git push
          fi
